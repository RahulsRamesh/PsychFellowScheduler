services:
  - type: web
    name: psych-fellow-scheduling-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: ALLOWED_ORIGINS
        value: "https://rahulsramesh.github.io"
      - key: API_KEY
        sync: false
      # CP-SAT parallel workers (see v2/solve.py). The free plan has only a
      # fraction of a CPU, so fewer workers finish faster here.
      - key: SOLVER_WORKERS
        value: "4"
